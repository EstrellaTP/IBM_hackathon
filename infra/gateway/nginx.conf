# Gateway: the only container published to the internet (port 8443, TLS).
# Terminates TLS, serves the static frontend and proxies the API to the internal
# services, which are reachable only on the compose network (docs/DECISIONS.md:
# ports published by Docker bypass the VM firewall, so nothing else is published).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Health data must not be cached by browsers or intermediaries.
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;  # a one-minute SignalBatch at 32 Hz is ~300 kB of JSON

    location = /health { default_type text/plain; return 200 "ok\n"; }
    location = /       { return 302 /patient/; }

    location /patient/   { alias /usr/share/nginx/html/patient/; }
    location /clinician/ { alias /usr/share/nginx/html/clinician/; }
    # Code shared by both pages (styles, API client ES module).
    location /shared/    { alias /usr/share/nginx/html/shared/; }

    # Patient side -> ingest-api (signal, answers, question WebSocket).
    location /api/v1/signal-batches { proxy_pass http://ingest-api:8000; include /etc/nginx/proxy_params.conf; }
    location /api/v1/answers        { proxy_pass http://ingest-api:8000; include /etc/nginx/proxy_params.conf; }
    location ~ ^/api/v1/patients/[^/]+/questions$ {
        proxy_pass http://ingest-api:8000;
        include /etc/nginx/proxy_params.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;  # the phone keeps the question channel open
    }

    # Clinician side -> evidence-api and suspicion-module.
    location /api/v1/clinician/ { proxy_pass http://evidence-api:8000; include /etc/nginx/proxy_params.conf; }
    location /api/v1/module-runs { proxy_pass http://suspicion-module:8000; include /etc/nginx/proxy_params.conf; }
}
