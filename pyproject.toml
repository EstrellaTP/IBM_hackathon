[project]
name = "mental-health-holter"
version = "0.1.0"
description = "A Holter for Mental Health: real-time episode detection and clinician evidence on IBM LinuxONE (IBM Z Datathon 2026, team GigaFly)."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pep8-naming, pyupgrade, bugbear, docstrings, simplify
select = ["E", "W", "F", "I", "N", "UP", "B", "D", "SIM"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
